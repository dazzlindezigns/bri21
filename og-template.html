<!doctype html>
<html><head><meta charset="utf-8">
<!-- Source for og.jpg (1200x630). Re-render with a headless browser screenshot at 1200x630. -->
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bricolage+Grotesque:wght@500;700&family=Yellowtail&display=block" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;overflow:hidden;background:#170B14;font-family:"Bricolage Grotesque",sans-serif;color:#F6EEF3;position:relative;
  background-image:radial-gradient(700px 420px at 78% 10%,rgba(255,62,165,.35),transparent 60%),radial-gradient(600px 400px at 10% 100%,rgba(255,62,165,.22),transparent 60%)}
.photo{position:absolute;left:70px;top:58px;width:372px;padding:16px 16px 58px;background:#FCE3EE;border-radius:6px;transform:rotate(-4deg);box-shadow:0 30px 60px rgba(0,0,0,.6),0 0 40px rgba(255,62,165,.35)}
.photo img{width:100%;height:430px;object-fit:cover;object-position:50% 25%;display:block;border-radius:3px}
.photo span{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-family:Yellowtail,cursive;font-size:32px;color:#A0145C}
.tape{position:absolute;top:-14px;left:50%;width:120px;height:32px;margin-left:-60px;background:rgba(255,143,205,.55);transform:rotate(3deg)}
.txt{position:absolute;left:520px;top:58px;right:40px}
.crown{width:64px;height:44px;margin-left:6px}
.chrome{font-family:Anton,sans-serif;font-size:150px;line-height:.92;text-transform:uppercase;letter-spacing:.01em;
  background:linear-gradient(180deg,#FFFFFF 0%,#E4E1E8 30%,#8D8996 48%,#F1EEF4 60%,#A6A2AF 82%,#E9E6EE 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 rgba(0,0,0,.6)) drop-shadow(0 0 18px rgba(255,62,165,.3))}
.neon{font-family:Yellowtail,cursive;color:#FFD3EA;text-shadow:0 0 6px rgba(255,62,165,.95),0 0 18px rgba(255,62,165,.7),0 0 44px rgba(255,62,165,.45)}
.n21{font-size:150px;line-height:.8;margin:-6px 0 0 6px}
.atw{font-size:54px;margin-top:4px}
.date{margin-top:22px;display:flex;gap:14px;align-items:center;font-weight:700;font-size:27px;letter-spacing:.06em;text-transform:uppercase}
.date i{width:8px;height:8px;border-radius:50%;background:#FF3EA5;box-shadow:0 0 10px #FF3EA5}
.sub{margin-top:8px;font-size:21px;color:#C2B6BF;letter-spacing:.02em}
.signs{position:absolute;right:34px;top:40px;display:grid;gap:9px;justify-items:end}
.signs b{font-family:Anton,sans-serif;font-weight:400;font-size:19px;letter-spacing:.06em;color:#FFD3EA;border:2px solid #FF3EA5;border-radius:6px;padding:3px 12px;
  box-shadow:0 0 10px rgba(255,62,165,.7),inset 0 0 8px rgba(255,62,165,.5);text-shadow:0 0 6px rgba(255,62,165,.9)}
</style></head><body>
<div class="photo"><div class="tape"></div><img src="images/bri-1.jpg" alt=""><span>the birthday girl</span></div>
<div class="signs"><b>MEXICO</b><b>NORWAY</b><b>JAPAN</b><b>FRANCE</b><b>UK</b></div>
<div class="txt">
  <svg class="crown" viewBox="0 0 64 44" fill="none" stroke="#FF3EA5" stroke-width="4" stroke-linejoin="round" style="filter:drop-shadow(0 0 6px #FF3EA5)"><path d="M4 38 L8 8 L22 24 L32 4 L42 24 L56 8 L60 38 Z"/></svg>
  <div class="chrome">Bri's</div>
  <div class="neon n21">21st</div>
  <div class="neon atw">Around the World</div>
  <div class="date">Feb 5–10, 2027 <i></i> Orlando, FL</div>
  <div class="sub">A big family trip. A bigger celebration.</div>
</div>
</body></html>
